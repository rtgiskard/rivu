[workspace]
members = ["crates/rivu-ui", "crates/rivu-format", "crates/rivu-migrate", "crates/rivu-dsp"]
resolver = "3"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "df48a139ce9c292738b523252c12f044697e673f", default-features = false }

[package]
name = "rivu"
version = "0.2.0"
edition = "2024"
description = "A lightweight, local-first Linux music player"

[features]
default = ["ffmpeg"]
ffmpeg = ["dep:bindgen", "dep:libloading"]
embed-nerd-font = []

[dependencies]
rivu-format = { path = "crates/rivu-format" }
rivu-ui = { path = "crates/rivu-ui" }
rivu-dsp = { path = "crates/rivu-dsp" }
hound = "3.5"
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive", "string"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
bytes = "1"
crossbeam-channel = "0.5"
crossterm = "0.29"
directories = "6"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
gpui.workspace = true
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "df48a139ce9c292738b523252c12f044697e673f", default-features = false, features = ["wayland"] }
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "file_chooser"] }
futures = "0.3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
libc = "0.2"
libloading = { version = "0.9", optional = true }
opus = "0.4"
parking_lot = "0.12"
rand = "0.10.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29", "std"] }
ringbuf = "0.5"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
rustfft = "6"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
signal-hook = "0.3.18"
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-metadata = "0.6.1"
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "sync", "time", "macros"] }
walkdir = "2"
tempfile = "3.27"
zbus = "5.19"
url = "2"
unicode-segmentation = "1.13.3"
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp"] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.1", features = ["v1_2_0"] }

[dev-dependencies]
toml = "1.1.8"
gpui = { workspace = true, features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Share libspa-sys's generator version instead of compiling two bindgen families.
bindgen = { version = "0.72.1", default-features = false, features = ["runtime"], optional = true }
pkg-config = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
# GPUI schedules nested idle callbacks; use its pinned nonblocking dispatcher.
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
# Bound metadata before allocation, including embedded and nested ID3 readers.
symphonia-metadata = { path = "vendor/symphonia-metadata" }
symphonia-bundle-flac = { path = "vendor/symphonia-bundle-flac" }
symphonia-format-isomp4 = { path = "vendor/symphonia-format-isomp4" }
symphonia-format-mkv = { path = "vendor/symphonia-format-mkv" }
symphonia-format-ogg = { path = "vendor/symphonia-format-ogg" }
symphonia-format-riff = { path = "vendor/symphonia-format-riff" }

# Pinned GPUI extensions: GPU image transforms and shared visualization materials.
[patch."https://github.com/zed-industries/zed"]
gpui = { path = "vendor/gpui" }
gpui_wgpu = { path = "vendor/gpui_wgpu" }
