[workspace]
members = ["crates/rivu-ui", "crates/rivu-format", "crates/rivu-utils", "crates/rivu-migrate", "crates/rivu-metadata", "crates/rivu-dsp", "crates/rivu-audio", "crates/rivu-protocol", "crates/rivu-client", "crates/rivu-visuals", "crates/rivu-presentation", "crates/rivu-tui", "crates/rivu-gui", "crates/rivu-shm", "crates/rivu-analysis"]
resolver = "3"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "df48a139ce9c292738b523252c12f044697e673f", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "df48a139ce9c292738b523252c12f044697e673f", default-features = false, features = ["wayland"] }

[package]
name = "rivu"
version = "0.2.20"
edition = "2024"
description = "A lightweight, local-first Linux music player"

[features]
default = ["gui", "tui", "ffmpeg", "onnx"]
gui = ["dep:rivu-gui", "dep:async-process"]
tui = ["dep:rivu-tui", "dep:async-process"]
test-support = ["rivu-audio/test-support", "rivu-metadata/test-support"]
ffmpeg = ["rivu-audio/ffmpeg"]
onnx = ["dep:ort", "dep:realfft", "dep:sha2"]
embed-nerd-font = ["gui", "rivu-gui/embed-nerd-font"]

[dependencies]
rivu-gui = { path = "crates/rivu-gui", optional = true }
rivu-tui = { path = "crates/rivu-tui", optional = true }
rivu-presentation = { path = "crates/rivu-presentation" }
rivu-format = { path = "crates/rivu-format", default-features = false, features = ["database"] }
rivu-utils = { path = "crates/rivu-utils", default-features = false, features = ["logging", "terminal"] }
rivu-audio = { path = "crates/rivu-audio", default-features = false }
rivu-metadata = { path = "crates/rivu-metadata", features = ["artwork"] }
rivu-dsp = { path = "crates/rivu-dsp", default-features = false, features = ["execution"] }
rivu-protocol = { path = "crates/rivu-protocol" }
rivu-client = { path = "crates/rivu-client" }
rivu-shm = { path = "crates/rivu-shm" }
hound = "3.5"
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive", "string"] }
bytes = "1"
async-channel = "2"
async-executor = "1"
async-io = "2"
async-process = { version = "2.5", optional = true }
async-lock = "3"
async-signal = "0.2"
futures-lite = "2"
event-listener = "5"
blocking = "1"
futures = "0.3"
tracing = "0.1"
libc = "0.2"
parking_lot = "0.13"
rand = "0.10.3"
rusqlite = { version = "0.42.0", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = { version = "0.11", optional = true }
realfft = { version = "3.5", optional = true }
# Load an explicitly installed runtime; never download/link a runtime at build time.
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "load-dynamic", "api-23"] }
tempfile = "3.27"
zbus = "6.3"
url = "2"


[dev-dependencies]
crossbeam-channel = "0.5"
postcard = { version = "1", default-features = false, features = ["use-std"] }
rivu-audio = { path = "crates/rivu-audio", default-features = false, features = ["test-support"] }
rivu-metadata = { path = "crates/rivu-metadata", features = ["test-support"] }
ringbuf = "0.6"
toml = "1.1.8"

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
# GPUI schedules nested idle callbacks; use its pinned nonblocking dispatcher.
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
# Bound metadata before allocation, including embedded and nested ID3 readers.
symphonia-metadata = { path = "vendor/symphonia-metadata" }
symphonia-bundle-flac = { path = "vendor/symphonia-bundle-flac" }
symphonia-format-isomp4 = { path = "vendor/symphonia-format-isomp4" }
symphonia-format-mkv = { path = "vendor/symphonia-format-mkv" }
symphonia-format-ogg = { path = "vendor/symphonia-format-ogg" }
symphonia-format-riff = { path = "vendor/symphonia-format-riff" }

# Pinned GPUI extensions maintained together in the independent renderer repository.
[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/rtgiskard/gpui-wgpu", tag = "v0.2.2" }
gpui_wgpu = { git = "https://github.com/rtgiskard/gpui-wgpu", tag = "v0.2.2" }
gpui_linux = { git = "https://github.com/rtgiskard/gpui-wgpu", tag = "v0.2.2" }
gpui_platform = { git = "https://github.com/rtgiskard/gpui-wgpu", tag = "v0.2.2" }
