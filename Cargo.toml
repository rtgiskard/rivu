[workspace]
members = ["crates/rivu-ui", "crates/rivu-format", "crates/rivu-migrate", "crates/rivu-dsp", "crates/rivu-audio", "crates/rivu-protocol", "crates/rivu-client", "crates/rivu-visuals"]
resolver = "3"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "df48a139ce9c292738b523252c12f044697e673f", default-features = false }

[package]
name = "rivu"
version = "0.2.2"
edition = "2024"
description = "A lightweight, local-first Linux music player"

[features]
default = ["ffmpeg"]
ffmpeg = ["rivu-audio/ffmpeg"]
embed-nerd-font = []

[dependencies]
rivu-format = { path = "crates/rivu-format", default-features = false, features = ["database"] }
rivu-audio = { path = "crates/rivu-audio", default-features = false }
rivu-ui = { path = "crates/rivu-ui" }
rivu-dsp = { path = "crates/rivu-dsp", default-features = false, features = ["execution"] }
rivu-protocol = { path = "crates/rivu-protocol" }
rivu-client = { path = "crates/rivu-client" }
rivu-visuals = { path = "crates/rivu-visuals" }
hound = "3.5"
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive", "string"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
bytes = "1"
async-channel = "2"
async-executor = "1"
async-io = "2"
async-lock = "3"
async-signal = "0.2"
futures-lite = "2"
event-listener = "5"
blocking = "1"
crossbeam-channel = "0.5"
crossterm = "0.29"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
gpui.workspace = true
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "df48a139ce9c292738b523252c12f044697e673f", default-features = false, features = ["wayland"] }
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "file_chooser"] }
futures = "0.3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
libc = "0.2"
parking_lot = "0.12"
rand = "0.10.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29", "std"] }
rusqlite = { version = "0.41.0", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
signal-hook = "0.4.5"
# Artwork needs container/tag probing; codecs and decoding belong to rivu-audio.
symphonia = { version = "0.6.1", default-features = false, features = ["all-formats", "all-meta", "flac", "mp1", "mp2", "mp3"] }
symphonia-metadata = "0.6.1"
tempfile = "3.27"
zbus = "5.19"
url = "2"
unicode-segmentation = "1.13.3"
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp"] }


[dev-dependencies]
postcard = { version = "1", default-features = false, features = ["use-std"] }
rivu-audio = { path = "crates/rivu-audio", default-features = false, features = ["test-support"] }
rivu-visuals = { path = "crates/rivu-visuals", features = ["test-support"] }
ringbuf = "0.5"
toml = "1.1.8"
gpui = { workspace = true, features = ["test-support"] }

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
# GPUI schedules nested idle callbacks; use its pinned nonblocking dispatcher.
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
# Bound metadata before allocation, including embedded and nested ID3 readers.
symphonia-metadata = { path = "vendor/symphonia-metadata" }
symphonia-bundle-flac = { path = "vendor/symphonia-bundle-flac" }
symphonia-format-isomp4 = { path = "vendor/symphonia-format-isomp4" }
symphonia-format-mkv = { path = "vendor/symphonia-format-mkv" }
symphonia-format-ogg = { path = "vendor/symphonia-format-ogg" }
symphonia-format-riff = { path = "vendor/symphonia-format-riff" }

# Pinned GPUI extensions: GPU image transforms and shared visualization materials.
[patch."https://github.com/zed-industries/zed"]
gpui = { path = "vendor/gpui" }
gpui_wgpu = { path = "vendor/gpui_wgpu" }
