[package]
name = "rivu-ui"
version.workspace = true
edition = "2024"
description = "Reusable GPUI controls with host-provided appearance"

[dependencies]
rivu-format = { path = "../rivu-format", default-features = false }
gpui.workspace = true
unicode-segmentation = "1.13.3"

[[example]]
name = "showcase"
path = "examples/showcase.rs"

[dev-dependencies]
rivu-presentation = { path = "../rivu-presentation" }
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
