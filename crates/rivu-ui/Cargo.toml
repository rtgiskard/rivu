[package]
name = "rivu-ui"
version = "0.2.0"
edition = "2024"
description = "Reusable GPUI controls with host-provided appearance"

[features]
default = []
showcase = ["dep:gpui_platform"]

[dependencies]
rivu-format = { path = "../rivu-format", default-features = false }
gpui.workspace = true
unicode-segmentation = "1.13.3"

[dependencies.gpui_platform]
workspace = true
optional = true

[[example]]
name = "showcase"
path = "examples/showcase.rs"
required-features = ["showcase"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
