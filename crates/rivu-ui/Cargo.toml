[package]
name = "rivu-ui"
version = "0.1.0"
edition = "2024"
description = "Reusable GPUI controls with host-provided appearance"

[features]
default = []
showcase = ["dep:gpui_platform"]

[dependencies]
gpui.workspace = true
unicode-segmentation = "1.13.3"

[dependencies.gpui_platform]
git = "https://github.com/zed-industries/zed"
rev = "df48a139ce9c292738b523252c12f044697e673f"
default-features = false
features = ["wayland"]
optional = true

[[example]]
name = "showcase"
path = "examples/showcase.rs"
required-features = ["showcase"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
