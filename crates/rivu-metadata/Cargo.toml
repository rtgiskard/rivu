[package]
name = "rivu-metadata"
version = "0.2.0"
edition = "2024"
description = "Shared audio metadata reading and explicit file editing"

[features]
artwork = ["dep:blake3", "dep:image", "dep:parking_lot", "dep:tracing", "dep:url"]
test-support = ["artwork"]

[dependencies]
anyhow = "1"
blake3 = { version = "1", optional = true }
image = { version = "0.25", default-features = false, optional = true }
lofty = "=0.25.5"
libc = "0.2"
parking_lot = { version = "0.12", optional = true }
rivu-utils = { path = "../rivu-utils", default-features = false }
serde = { version = "1", features = ["derive"] }
tempfile = "3.27"
tracing = { version = "0.1", optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
serde_json = "1"
