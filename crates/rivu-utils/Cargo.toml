[package]
name = "rivu-utils"
version = "0.2.0"
edition = "2024"
description = "General-purpose filesystem and optional diagnostic utilities for Rivu"

[features]
default = []
logging = ["dep:anyhow", "dep:chrono", "dep:tracing", "dep:tracing-appender", "dep:tracing-subscriber"]
terminal = ["dep:clap"]

[dependencies]
libc = "0.2"
anyhow = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
clap = { version = "4", optional = true }
tracing = { version = "0.1", optional = true }
tracing-appender = { version = "0.2", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[dev-dependencies]
anyhow = "1"
tempfile = "3.27"
