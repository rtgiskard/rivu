[package]
name = "rivu-client"
version = "0.2.0"
edition = "2024"
description = "Reusable synchronous Rivu IPC client sessions"

[dependencies]
rivu-protocol = { path = "../rivu-protocol" }
anyhow = "1"
bytes = "1"
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1", features = ["test-util"] }
