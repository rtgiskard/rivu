[package]
name = "rivu-format"
version = "0.2.0"
edition = "2024"
description = "Current Rivu configuration and database format contracts"

[features]
default = []
database = ["dep:rusqlite"]

[dependencies]
anyhow = "1"
directories = "6"
libc = "0.2"
rivu-dsp = { path = "../rivu-dsp", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"], optional = true }
serde = { version = "1", features = ["derive"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27"
