[package]
name = "rivu-format"
version.workspace = true
edition = "2024"
description = "Current Rivu configuration and database format contracts"

[features]
default = []
database = ["dep:rusqlite"]

[dependencies]
anyhow = "1"
directories = "6"
rivu-dsp = { path = "../rivu-dsp", default-features = false }
rivu-utils = { path = "../rivu-utils", default-features = false }
rusqlite = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
toml = "1.1.8"
toml_edit = { version = "0.25.17", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27"
