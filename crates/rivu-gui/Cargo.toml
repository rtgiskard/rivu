[package]
name = "rivu-gui"
version = "0.2.8"
edition = "2024"

[features]
default = []
embed-nerd-font = []

[dependencies]
rivu-dsp = { path = "../rivu-dsp", default-features = false }
rivu-format = { path = "../rivu-format", default-features = false }
rivu-utils = { path = "../rivu-utils", default-features = false }
rivu-protocol = { path = "../rivu-protocol" }
rivu-analysis = { path = "../rivu-analysis" }
rivu-client = { path = "../rivu-client" }
rivu-shm = { path = "../rivu-shm" }
rivu-presentation = { path = "../rivu-presentation" }
rivu-metadata = { path = "../rivu-metadata", features = ["artwork"] }
rivu-ui = { path = "../rivu-ui" }
rivu-visuals = { path = "../rivu-visuals" }
gpui.workspace = true
gpui_platform.workspace = true
anyhow = "1"
async-channel = "2"
async-executor = "1"
async-io = "2"
async-signal = "0.2"
futures-lite = "2"
blake3 = "1"
tempfile = "3.27"
ashpd = { version = "0.14.0", default-features = false, features = ["async-io", "file_chooser"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
parking_lot = "0.13"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tracing = "0.1"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp"] }

[dev-dependencies]
rivu = { path = "../..", default-features = false, features = ["test-support"] }
rivu-audio = { path = "../rivu-audio", default-features = false, features = ["test-support"] }
rivu-metadata = { path = "../rivu-metadata", features = ["test-support"] }
rivu-visuals = { path = "../rivu-visuals", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
libc = "0.2"
