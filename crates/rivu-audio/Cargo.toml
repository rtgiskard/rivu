[package]
name = "rivu-audio"
version = "0.2.0"
edition = "2024"
description = "Rivu audio decoding, playback, rendering, waveform and PCM capture engine"

[features]
default = ["ffmpeg"]
ffmpeg = ["dep:bindgen", "dep:libloading"]
# Application fixtures exercise command admission and PCM ownership.
test-support = ["rivu-protocol/test-support"]

[dependencies]
rivu-dsp = { path = "../rivu-dsp", default-features = false, features = ["execution"] }
rivu-format = { path = "../rivu-format", default-features = false }
rivu-metadata = { path = "../rivu-metadata" }
rivu-utils = { path = "../rivu-utils", default-features = false }
rivu-protocol = { path = "../rivu-protocol" }
rivu-shm = { path = "../rivu-shm" }
anyhow = "1"
async-channel = "2"
async-io = "2"
crossbeam-channel = "0.5"
futures = "0.3"
libc = "0.2"
libloading = { version = "0.9", optional = true }
opus = "0.4"
parking_lot = "0.12"
ringbuf = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-metadata = "0.6.1"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.1", features = ["v1_2_0"] }

[dev-dependencies]
hound = "3.5"
tempfile = "3.27"
rivu-protocol = { path = "../rivu-protocol", features = ["test-support"] }
rivu-analysis = { path = "../rivu-analysis" }

[build-dependencies]
# Share libspa-sys's generator version instead of compiling two bindgen families.
bindgen = { version = "0.72.1", default-features = false, features = ["runtime"], optional = true }
pkg-config = "0.3"
