[package]
name = "rivu-audio"
version = "0.2.0"
edition = "2024"
description = "Rivu audio decoding, playback, rendering, waveform and analysis engine"

[features]
default = ["ffmpeg"]
ffmpeg = ["dep:bindgen", "dep:libloading"]
# Existing application tests exercise analyzer demand and command admission.
test-support = []

[dependencies]
rivu-dsp = { path = "../rivu-dsp" }
rivu-format = { path = "../rivu-format" }
anyhow = "1"
crossbeam-channel = "0.5"
hound = "3.5"
libc = "0.2"
libloading = { version = "0.9", optional = true }
opus = "0.4"
parking_lot = "0.12"
ringbuf = "0.5"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-metadata = "0.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.1", features = ["v1_2_0"] }

[dev-dependencies]
tempfile = "3.27"

[build-dependencies]
# Share libspa-sys's generator version instead of compiling two bindgen families.
bindgen = { version = "0.72.1", default-features = false, features = ["runtime"], optional = true }
pkg-config = "0.3"
