[package]
name = "rivu-visuals"
version = "0.2.0"
edition = "2024"
description = "Rivu GPUI audio visualization renderers"

[features]
test-support = ["rivu-analysis/test-support"]

[dependencies]
rivu-format = { path = "../rivu-format", default-features = false }
rivu-protocol = { path = "../rivu-protocol" }
rivu-analysis = { path = "../rivu-analysis" }
rivu-presentation = { path = "../rivu-presentation" }
rivu-ui = { path = "../rivu-ui" }
gpui.workspace = true
parking_lot = "0.12"
anyhow = "1"
futures = "0.3"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
rivu-analysis = { path = "../rivu-analysis", features = ["test-support"] }
